<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>H-Basket Pattern Calc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: #222;
      font: 16px/1.4 system-ui, sans-serif;
    }
    main { max-width: 720px; margin: auto; }
    h1 { margin: 0 0 24px; font-size: 24px; font-weight: 600; }
    .fields { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    .actions { display: flex; gap: 12px; margin: 20px 0 0; }
    label { display: grid; gap: 4px; }
    input {
      width: 100px;
      padding: 8px;
      border: 1px solid #aaa;
      border-radius: 4px;
      font: inherit;
    }
    button { padding: 8px 12px; font: inherit; cursor: pointer; }
    .result { margin-bottom: 30px; }
    .canvas { position: relative; }
    svg { display: block; border: 1px solid #ddd; touch-action: none; }
    circle { fill: #bbb; }
    rect { fill: none; stroke: #222; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .floor { fill: #eee; stroke: none; opacity: 0.5; }
    .wall { fill: #eaf4ff; stroke: none; opacity: 0.5; }
    .side { fill: #ffeaea; stroke: none; opacity: 0.5; }
    line { stroke: #222; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .fold-line { stroke-width: 0.75; }
    .measure-line { stroke: #d33; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .measure-label { position: absolute; color: #d33; font-size: 14px; line-height: 1; white-space: nowrap; pointer-events: none; transform-origin: center; }
    .dimension-label { position: absolute; color: #222; font-size: 14px; line-height: 1; white-space: nowrap; transform: translate(-50%, -100%); }
    .vertical-label { transform: translate(-50%, -50%) rotate(-90deg); }
    .fold-label { position: absolute; color: #222; font-size: 14px; line-height: 1; white-space: nowrap; pointer-events: none; transform: translate(-50%, -50%); }
  </style>
</head>
<body>
  <main>
    <h1>H-Basket Pattern Calc</h1>

    <div class="fields">
      <label>Ширина (a) <input id="a" type="number" min="0" value="120"></label>
      <label>Длина (b) <input id="b" type="number" min="0" value="180"></label>
      <label>Высота (h) <input id="h" type="number" min="0" value="50"></label>
      <label>Припуск (p) <input id="p" type="number" min="0" value="15"></label>
      <label>Масштаб <input id="scale" type="number" min="0.1" step="0.1" value="2"></label>
    </div>

    <div class="result">Размер выкройки: <output id="size"></output> мм</div>
    <div class="canvas">
      <svg id="pattern" role="img" aria-label="Холст выкройки"></svg>
      <div id="measureLabel" class="measure-label" hidden></div>
      <div id="outerLabel" class="dimension-label"></div>
      <div id="innerLabel" class="dimension-label"></div>
      <div id="floorLabel" class="dimension-label"></div>
      <div id="outerTopVerticalLabel" class="dimension-label vertical-label"></div>
      <div id="outerBottomVerticalLabel" class="dimension-label vertical-label"></div>
      <div id="innerTopVerticalLabel" class="dimension-label vertical-label"></div>
      <div id="innerBottomVerticalLabel" class="dimension-label vertical-label"></div>
      <div id="foldLeftTopLabel" class="fold-label"></div>
      <div id="foldLeftBottomLabel" class="fold-label"></div>
      <div id="floorVerticalLabel" class="dimension-label vertical-label"></div>
      <div id="notchVerticalLabel" class="dimension-label vertical-label"></div>
    </div>

    <div class="actions">
      <button id="reset" type="button">Сбросить</button>
      <button id="share" type="button">Поделиться ссылкой с размерами</button>
    </div>
  </main>

  <script>
    const fields = ['a', 'b', 'h', 'p', 'scale'].map(id => document.getElementById(id));
    const svg = document.getElementById('pattern');
    const size = document.getElementById('size');
    const measureLabel = document.getElementById('measureLabel');
    const resetButton = document.getElementById('reset');
    const shareButton = document.getElementById('share');
    const defaults = { a: 100, b: 160, h: 50, p: 15, scale: 2 };
    const storageKey = 'h-basket-pattern-values';
    const dimensionLabels = [
      document.getElementById('outerLabel'),
      document.getElementById('innerLabel'),
      document.getElementById('floorLabel')
    ];
    const verticalLabels = [
      document.getElementById('outerTopVerticalLabel'),
      document.getElementById('outerBottomVerticalLabel'),
      document.getElementById('innerTopVerticalLabel'),
      document.getElementById('innerBottomVerticalLabel')
    ];
    const foldLabels = [
      document.getElementById('foldLeftTopLabel'),
      document.getElementById('foldLeftBottomLabel')
    ];
    const floorVerticalLabel = document.getElementById('floorVerticalLabel');
    const notchVerticalLabel = document.getElementById('notchVerticalLabel');
    let canvasWidth = 0;
    let canvasHeight = 0;
    let measure = null;
    const LABEL_GAP = 4;
    const LABEL_OFFSET = 4;

    const line = (x1, y1, x2, y2, className = '') =>
      `<line${className ? ` class="${className}"` : ''} x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    const rect = (className, x, y, width, height) =>
      `<rect class="${className}" x="${x}" y="${y}" width="${width}" height="${height}"/>`;

    function values() {
      return Object.fromEntries(fields.map(field => [field.id, field.value]));
    }

    function setValues(data) {
      fields.forEach(field => {
        if (data[field.id] !== undefined) field.value = data[field.id];
      });
      draw();
    }

    function saveValues() {
      localStorage.setItem(storageKey, JSON.stringify(values()));
    }

    function draw() {
      const [a, b, h, p, scale] = fields.map(field => Math.max(0, Number(field.value) || 0));
      const width = a + b + 2 * p;
      const height = a + 2 * h + 2 * p;
      canvasWidth = width;
      canvasHeight = height;
      size.value = `${width} × ${height}`;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      // 1 мм выкройки соответствует 1 px на экране: меняется физический
      // размер холста, а не только его масштабирование.
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      svg.style.width = `${width * scale}px`;
      svg.style.height = `${height * scale}px`;

      // Точка каждые 10 мм: для 340×250 мм получается сетка 34×25 точек.
      const dots = [];
      for (let y = 0; y < height; y += 10) {
        for (let x = 0; x < width; x += 10) {
          dots.push(`<circle cx="${x}" cy="${y}" r="${0.6 / scale}"/>`);
        }
      }
      const innerWidth = Math.max(0, width - 2 * p);
      const floorX = (width - b) / 2;
      const floorY = (height - a) / 2;
      const cutStart = floorY + p;
      const cutEnd = floorY + a - p;
      dimensionLabels[0].textContent = `a + b + 2p = ${a} + ${b} + 2×${p} = ${width} мм`;
      dimensionLabels[1].textContent = `a + b = ${a} + ${b} = ${a + b} мм`;
      dimensionLabels[2].textContent = `b = ${b} мм`;
      verticalLabels[0].textContent = `h + 2p = ${h + 2 * p} мм`;
      verticalLabels[1].textContent = `h + 2p = ${h + 2 * p} мм`;
      verticalLabels[2].textContent = `h = ${h} мм`;
      verticalLabels[3].textContent = `h = ${h} мм`;
      foldLabels.forEach(label => { label.textContent = `a/2 = ${a/2}`; });
      floorVerticalLabel.textContent = `a = ${a}`;
      notchVerticalLabel.textContent = `a-2p = ${a - 2 * p}`;
      dimensionLabels[0].hidden = p === 0;
      verticalLabels[0].hidden = p === 0;
      verticalLabels[1].hidden = p === 0;
      notchVerticalLabel.hidden = p === 0;
      // Не сохранять состояние hidden после предыдущего значения p = 0.
      dimensionLabels[1].hidden = false;
      dimensionLabels[2].hidden = false;
      verticalLabels[2].hidden = false;
      verticalLabels[3].hidden = false;
      foldLabels.forEach(label => { label.hidden = false; });
      floorVerticalLabel.hidden = false;
      const box = svg.getBoundingClientRect();
      const scaleX = box.width / width;
      dimensionLabels.forEach((label, index) => {
        const y = [0, p, floorY][index];
        const x = [width / 2, width / 2, floorX + b / 2][index];
        label.style.left = `${x * scaleX}px`;
        label.style.top = `${y * box.height / height + (index === 1 ? 6 : -8)}px`;
        label.style.transform = index === 1 ? 'translate(-50%, 0)' : 'translate(-50%, -100%)';
      });
      // Фиксированный зазор в пикселях не зависит от масштаба чертежа.
      const verticalPositions = [
        [-LABEL_GAP, cutStart / 2],
        [-LABEL_GAP, (cutEnd + height) / 2],
        [p + LABEL_GAP, (p + floorY) / 2],
        [p + LABEL_GAP, (floorY + a + height - p) / 2]
      ];
      verticalLabels.forEach((label, index) => {
        const [x, y] = verticalPositions[index];
        label.style.left = `${x * scaleX}px`;
        label.style.top = `${y * box.height / height}px`;
      });
      const foldPositions = [
        [a / 4, cutStart],
        [a / 4, cutEnd]
      ];
      foldLabels.forEach((label, index) => {
        const [x, y] = foldPositions[index];
        label.style.left = `${x * scaleX}px`;
        label.style.top = `${y * box.height / height + (index ? -LABEL_OFFSET : LABEL_OFFSET)}px`;
        label.style.transform = `translate(-50%, ${index ? '-100%' : '0'})`;
      });
      [floorVerticalLabel, notchVerticalLabel].forEach((label, index) => {
        // Подписи ставим рядом с соответствующими вертикальными линиями:
        // «a» — у левой границы дна, «a-2p» — у линии выреза.
        const x = index ? a / 2 - 4 : floorX + 4;
        label.style.left = `${x * scaleX}px`;
        label.style.top = `${(floorY + a / 2) * box.height / height}px`;
      });
      // Три линии от верхнего конца пустого сегмента: вправо, вниз, влево.
      const shapes = [
        rect('side', p, p, floorX - p, floorY - p),
        rect('side', floorX + b, p, floorX - p, floorY - p),
        rect('wall', floorX, p, b, floorY - p),
        rect('floor', floorX, floorY, b, a),
        rect('side', p, floorY + a, floorX - p, height - p - floorY - a),
        rect('side', floorX + b, floorY + a, floorX - p, height - p - floorY - a),
        rect('wall', floorX, floorY + a, b, height - p - floorY - a),
        line(0, 0, width, 0), line(0, height, width, height),
        line(0, 0, 0, cutStart), line(0, cutEnd, 0, height),
        line(width, 0, width, cutStart), line(width, cutEnd, width, height),
        line(0, cutStart, a / 2, cutStart, 'fold-line'),
        line(a / 2, cutStart, a / 2, cutEnd, 'fold-line'),
        line(a / 2, cutEnd, 0, cutEnd, 'fold-line'),
        line(width, cutStart, width - a / 2, cutStart, 'fold-line'),
        line(width - a / 2, cutStart, width - a / 2, cutEnd, 'fold-line'),
        line(width - a / 2, cutEnd, width, cutEnd, 'fold-line'),
        line(p, p, width - p, p), line(p, p, p, floorY),
        line(p, floorY + a, p, height - p), line(width - p, p, width - p, floorY),
        line(width - p, floorY + a, width - p, height - p),
        line(p, height - p, width - p, height - p),
        line(floorX, floorY, floorX, floorY + a),
        line(floorX + b, floorY, floorX + b, floorY + a),
        line(p, floorY, floorX, floorY), line(floorX + b, floorY, width - p, floorY),
        line(p, floorY + a, floorX, floorY + a),
        line(floorX + b, floorY + a, width - p, floorY + a)
      ];
      svg.innerHTML = dots.join('') + shapes.join('');
      if (measure) drawMeasure(measure.end);
    }

    function point(event) {
      const box = svg.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * canvasWidth / box.width,
        y: (event.clientY - box.top) * canvasHeight / box.height
      };
    }

    function drawMeasure(end) {
      const dx = end.x - measure.start.x;
      const dy = end.y - measure.start.y;
      const length = Math.sqrt(dx * dx + dy * dy);
      let angle = Math.atan2(dy, dx) * 180 / Math.PI;
      if (angle > 90 || angle < -90) angle += 180;
      let group = svg.querySelector('.measurement');
      if (!group) {
        group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        group.setAttribute('class', 'measurement');
        svg.appendChild(group);
      }
      group.innerHTML = `<line class="measure-line" x1="${measure.start.x}" y1="${measure.start.y}" x2="${end.x}" y2="${end.y}"/>`;
      const box = svg.getBoundingClientRect();
      const mx = ((measure.start.x + end.x) / 2) * box.width / canvasWidth;
      const my = ((measure.start.y + end.y) / 2) * box.height / canvasHeight;
      measureLabel.textContent = `${Math.round(length)} мм`;
      measureLabel.hidden = false;
      measureLabel.style.left = `${mx}px`;
      measureLabel.style.top = `${my - 8}px`;
      measureLabel.style.transform = `translate(-50%, -50%) rotate(${angle}deg)`;
    }

    function clearMeasure() {
      svg.querySelector('.measurement')?.remove();
      measureLabel.hidden = true;
      measure = null;
    }

    svg.addEventListener('pointerdown', event => {
      if (measure) {
        clearMeasure();
        return;
      }
      measure = { start: point(event), end: point(event) };
      svg.setPointerCapture(event.pointerId);
      drawMeasure(measure.end);
    });

    svg.addEventListener('pointermove', event => {
      if (!measure) return;
      measure.end = point(event);
      drawMeasure(measure.end);
    });

    svg.addEventListener('pointerup', event => {
      if (!measure) return;
      measure.end = point(event);
      drawMeasure(measure.end);
      svg.releasePointerCapture(event.pointerId);
    });

    svg.addEventListener('pointercancel', event => {
      if (measure && svg.hasPointerCapture(event.pointerId)) {
        svg.releasePointerCapture(event.pointerId);
      }
      clearMeasure();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') clearMeasure();
    });

    fields.forEach(field => field.addEventListener('input', draw));
    fields.forEach(field => field.addEventListener('input', saveValues));
    fields.forEach(field => field.addEventListener('wheel', event => {
      event.preventDefault();
      field.stepUp(event.deltaY < 0 ? 1 : -1);
      field.dispatchEvent(new Event('input', { bubbles: true }));
    }, { passive: false }));

    resetButton.addEventListener('click', () => {
      setValues(defaults);
      saveValues();
    });

    shareButton.addEventListener('click', async () => {
      const url = new URL(window.location.href);
      Object.entries(values()).forEach(([key, value]) => {
        if (key !== 'scale') url.searchParams.set(key, value);
      });
      try {
        await navigator.clipboard.writeText(url.href);
        shareButton.textContent = 'Ссылка скопирована';
        setTimeout(() => { shareButton.textContent = 'Поделиться'; }, 1500);
      } catch {
        window.prompt('Скопируйте ссылку:', url.href);
      }
    });

    const params = new URLSearchParams(window.location.search);
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    setValues(params.toString() ? Object.fromEntries(params) : (saved || defaults));
    draw();
  </script>
</body>
</html>
